<!DOCTYPE html>
<html lang="en">

<head>

        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Instagram - Explore</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =================================================
         DESKTOP SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="instagram-logo">
            Instagram
        </div>


        <nav class="sidebar-nav">


            <a href="feed.html">

                <span class="nav-icon">⌂</span>

                <span>Home</span>

            </a>


            <a href="#">

                <span class="nav-icon">⌕</span>

                <span>Search</span>

            </a>


            <a href="explore.html" class="active-nav">

                <span class="nav-icon">◎</span>

                <span>Explore</span>

            </a>


            <a href="#">

                <span class="nav-icon">▶</span>

                <span>Reels</span>

            </a>


            <a href="#">

                <span class="nav-icon">♡</span>

                <span>Messages</span>

            </a>


            <a href="#">

                <span class="nav-icon">♡</span>

                <span>Notifications</span>

            </a>


            <a href="index.html">

                <span class="nav-avatar"></span>

                <span>Profile</span>

            </a>


        </nav>


        <a href="#" class="more-link">

            <span class="nav-icon">☰</span>

            <span>More</span>

        </a>


    </aside>



    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main-content">


        <section class="explore-container">


            <!-- Search bar -->

            <header class="explore-header">

                <div class="search-input">

                    <span>⌕</span>

                    <input
                        type="text"
                        placeholder="Search"
                    >

                </div>

            </header>



            <!-- Explore grid -->

            <section class="explore-grid">


                <div class="explore-photo explore-one"></div>


                <div class="explore-photo explore-two"></div>


                <div class="explore-photo explore-three tall"></div>


                <div class="explore-photo explore-four"></div>


                <div class="explore-photo explore-five"></div>


                <div class="explore-photo explore-six"></div>


                <div class="explore-photo explore-seven wide"></div>


                <div class="explore-photo explore-eight"></div>


                <div class="explore-photo explore-nine"></div>


                <div class="explore-photo explore-ten"></div>


                <div class="explore-photo explore-eleven"></div>


                <div class="explore-photo explore-twelve"></div>


            </section>


        </section>


    </main>



    <!-- =================================================
         MOBILE BOTTOM NAVIGATION
    ================================================== -->

    <nav class="mobile-navigation">


        <a href="feed.html">
            ⌂
        </a>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Instagram - Profile</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =================================================
         DESKTOP SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="instagram-logo">
            Instagram
        </div>


        <nav class="sidebar-nav">

            <a href="feed.html">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </a>


            <a href="#">
                <span class="nav-icon">⌕</span>
                <span>Search</span>
            </a>


            <a href="explore.html">
                <span class="nav-icon">◎</span>
                <span>Explore</span>
            </a>


            <a href="#">
                <span class="nav-icon">▶</span>
                <span>Reels</span>
            </a>


            <a href="#">
                <span class="nav-icon">♡</span>
                <span>Messages</span>
            </a>


            <a href="#">
                <span class="nav-icon">♡</span>
                <span>Notifications</span>
            </a>


            <a href="#" class="active-nav">

                <span class="nav-avatar"></span>

                <span>Profile</span>

            </a>

        </nav>


        <a href="#" class="more-link">

            <span class="nav-icon">☰</span>

            <span>More</span>

        </a>

    </aside>



    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main-content">


        <section class="profile-container">


            <!-- Profile header -->

            <header class="profile-header">


                <div class="large-profile-picture">
                    👤
                </div>


                <div class="profile-information">


                    <div class="username-row">

                        <h1>your_username</h1>

                        <button class="edit-button">
                            Edit profile
                        </button>

                    </div>


                    <div class="profile-statistics">

                        <span>
                            <strong>12</strong> posts
                        </span>

                        <span>
                            <strong>1,245</strong> followers
                        </span>

                        <span>
                            <strong>320</strong> following
                        </span>

                    </div>


                    <p class="bio">

                        Your Name<br>

                        Software Engineering Student<br>

                        Web Developer

                    </p>


                </div>

            </header>



            <!-- Story highlights -->

            <section class="story-highlights">


                <div class="story">

                    <div class="story-image">
                        🌸
                    </div>

                    <span>Travel</span>

                </div>


                <div class="story">

                    <div class="story-image">
                        💻
                    </div>

                    <span>Work</span>

                </div>


                <div class="story">

                    <div class="story-image">
                        ☕
                    </div>

                    <span>Life</span>

                </div>


                <div class="story">

                    <div class="story-image">
                        🌿
                    </div>

                    <span>Nature</span>

                </div>


                <div class="story">

                    <div class="new-story">
                        +
                    </div>

                    <span>New</span>

                </div>


            </section>



            <!-- Profile tabs -->

            <nav class="profile-tabs">

                <a href="#" class="selected-tab">

                    <span>▦</span>

                    POSTS

                </a>


                <a href="#">

                    <span>▶</span>

                    REELS

                </a>


                <a href="#">

                    <span>▣</span>

                    TAGGED

                </a>

            </nav>



            <!-- Posts -->

            <section class="profile-post-grid">

                <div class="photo photo-1"></div>

                <div class="photo photo-2"></div>

                <div class="photo photo-3"></div>

                <div class="photo photo-4"></div>

                <div class="photo photo-5"></div>

                <div class="photo photo-6"></div>

                <div class="photo photo-7"></div>

                <div class="photo photo-8"></div>

                <div class="photo photo-9"></div>

            </section>


        </section>


    </main>



    <!-- =================================================
         MOBILE BOTTOM NAVIGATION
    ================================================== -->

    <nav class="mobile-navigation">


        <a href="feed.html">
            ⌂
        </a>


        <a href="#">
            ⌕
        </a>


        <a href="explore.html">
            ◎
        </a>


        <a href="#">
            ♡
        </a>


        <a href="index.html">

            <span class="mobile-profile"></span>

        </a>


    </nav>


</body>

</html>
